[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewhub"
version = "0.1.0"
description = "Review collection and operational insights for Azzurro Hotels"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",  # file uploads
    "httpx>=0.27",              # OpenRouter client
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",   # PostgreSQL driver; SQLite needs nothing extra
    "tzdata>=2024.1",         # Australia/Sydney zone data on Windows
    "playwright>=1.48",         # public-page collector (visible, unmodified browser)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # Embedded PostgreSQL for local tests when no server/Docker is available.
    # CI uses a PostgreSQL service container instead (REVIEWHUB_TEST_PG_URL).
    "pixeltable-pgserver>=0.4; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]

[project.scripts]
reviewhub = "reviewhub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reviewhub = ["persistence/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requires PostgreSQL (always run; skipped only if no server can be started)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "src/reviewhub/persistence/migrations/versions",  # frozen, hand-reviewed migrations
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Layout is owned by `ruff format`; long message strings stay on one line for readability.
ignore = ["E501"]


[tool.ruff.lint.per-file-ignores]
"src/reviewhub/intelligence/schema.py" = ["RUF001"]  # typographic quotes are matched on purpose
"src/reviewhub/intelligence/lexicon.py" = ["RUF001"]  # typographic quotes/dashes are matched on purpose
"tests/test_lexicon.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "src/reviewhub/core",
    "src/reviewhub/persistence",
    "src/reviewhub/ingestion",
    "src/reviewhub/demo",
    "src/reviewhub/collection",
    "src/reviewhub/intelligence",
    "src/reviewhub/analytics",
    "src/reviewhub/api",
    "src/reviewhub/cli.py",
]

[[tool.mypy.overrides]]
module = ["pixeltable_pgserver.*", "alembic.*"]
ignore_missing_imports = true
