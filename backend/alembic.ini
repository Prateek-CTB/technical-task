# Convenience for the plain `alembic` CLI (run from backend/). The URL comes from
# REVIEWHUB_DATABASE_URL / .env via reviewhub.core.settings (see migrations/env.py).
[alembic]
script_location = src/reviewhub/persistence/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
