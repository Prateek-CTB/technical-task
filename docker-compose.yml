# Local PostgreSQL 16 (the production-profile database, ADR 0004).
#   cp .env.example .env     # then set POSTGRES_PASSWORD
#   docker compose up -d db
#   REVIEWHUB_DATABASE_URL=postgresql://reviewhub:<password>@localhost:5432/reviewhub reviewhub db upgrade
# SQLite needs none of this: it is the zero-setup default.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reviewhub
      POSTGRES_USER: reviewhub
      # No password is committed: compose refuses to start until it is set in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # bound to localhost only
    volumes:
      - reviewhub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewhub -d reviewhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reviewhub-pgdata:
